services:
  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data

  load:
    build: .
    command: ["python", "-m", "src.load.load_raw"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
        
  dbt:
    build: ./dbt
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./dbt:/usr/app/dbt
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  pgdata: